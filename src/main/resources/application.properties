spring.application.name=electricity-monitor

# Default database: H2 stored in ./data (survives restarts, no setup needed)
spring.datasource.url=jdbc:h2:file:./data/electricity
spring.datasource.username=postgres
spring.datasource.password=labos
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.error.include-message=always

# Time zone used for hour/day/month/year buckets
app.zone=Asia/Bangkok

# Auto simulator
simulator.enabled=true
simulator.interval-ms=10000

# Raw readings older than this are deleted nightly (summaries are kept)
retention.days=7
