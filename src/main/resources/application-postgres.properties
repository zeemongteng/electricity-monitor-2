spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/electricity}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.h2.console.enabled=false

# Small pool for a free database; recycle connections before the host closes idle ones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=240000
