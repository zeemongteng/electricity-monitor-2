# Optional: PostgreSQL for the "postgres" profile
#   docker compose up -d
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: electricity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
